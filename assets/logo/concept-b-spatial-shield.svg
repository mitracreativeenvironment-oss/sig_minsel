<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>

    <linearGradient id="goldGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="redGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- 5-Pointed Perisai Shield (Bentuk Perisai Resmi Minahasa Selatan) -->
  <path
    d="M 40 32 
       L 216 32 
       L 216 138 
       C 216 190, 160 224, 128 238 
       C 96 224, 40 190, 40 138 Z"
    fill="url(#shieldGradB)"
    stroke="url(#goldGradB)"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Upper Carmine Red Banner (Merah Perjuangan) -->
  <path
    d="M 46 38 
       L 210 38 
       L 210 94 
       C 168 102, 88 102, 46 94 Z"
    fill="url(#redGradB)"
  />

  <!-- Stylized Geometric Manguni Wings (Bentangan Sayap Manguni) -->
  <path
    d="M 52 104 
       L 84 104 
       L 98 140 
       L 76 168 
       C 64 154, 56 134, 52 104 Z"
    fill="#f59e0b"
  />
  <path
    d="M 204 104 
       L 172 104 
       L 158 140 
       L 180 168 
       C 192 154, 200 134, 204 104 Z"
    fill="#f59e0b"
  />

  <!-- Central Geodetic Compass Rose (Bintang Kompas Penunjuk Arah) -->
  <!-- North Arrow (Emas Terang) -->
  <polygon points="128,60 135,118 128,112 121,118" fill="#fde047" />
  <polygon points="128,60 128,112 121,118" fill="#f59e0b" />

  <!-- South Arrow -->
  <polygon points="128,164 135,118 128,124 121,118" fill="#94a3b8" />
  <polygon points="128,164 128,124 121,118" fill="#64748b" />

  <!-- East Arrow -->
  <polygon points="180,118 128,125 134,118 128,111" fill="#cbd5e1" />
  <polygon points="180,118 134,118 128,111" fill="#94a3b8" />

  <!-- West Arrow -->
  <polygon points="76,118 128,125 122,118 128,111" fill="#cbd5e1" />
  <polygon points="76,118 122,118 128,111" fill="#94a3b8" />

  <!-- Center Pivot Core -->
  <circle cx="128" cy="118" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="2" />

  <!-- Open Book of Data & Science (Buku di Dada) -->
  <path
    d="M 102 166 
       C 114 162, 124 163, 128 166 
       C 132 163, 142 162, 154 166 
       L 152 182 
       C 140 178, 131 179, 128 182 
       C 125 179, 116 178, 104 182 Z"
    fill="#ffffff"
  />

  <!-- Maritime Anchor of Amurang Bay (Jangkar Laut Minsel) -->
  <path
    d="M 128 190 
       L 128 218 
       M 116 196 
       L 140 196 
       M 106 206 
       C 112 222, 144 222, 150 206"
    fill="none"
    stroke="#38bdf8"
    stroke-width="3"
    stroke-linecap="round"
  />
  <circle cx="128" cy="188" r="3" fill="#38bdf8" />
</svg>
