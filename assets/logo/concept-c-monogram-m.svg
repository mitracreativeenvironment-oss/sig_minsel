<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="mGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="mGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="mGradCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect width="256" height="256" rx="48" fill="#0b132b" />

  <!-- Left Wing Pillar of 'M' (Sayap Merah Minahasa) -->
  <path
    d="M 44 204 
       L 44 82 
       C 44 64, 58 52, 74 60 
       L 112 84 
       L 92 124 
       L 68 108 
       L 68 204 Z"
    fill="url(#mGradLeft)"
  />

  <!-- Right Wing Pillar of 'M' (Sayap Bahari Amurang) -->
  <path
    d="M 212 204 
       L 212 82 
       C 212 64, 198 52, 182 60 
       L 144 84 
       L 164 124 
       L 188 108 
       L 188 204 Z"
    fill="url(#mGradRight)"
  />

  <!-- Central Peak & Chevron (Puncak Soputan & Paruh Emas) -->
  <path
    d="M 128 88 
       L 162 144 
       L 142 168 
       L 128 144 
       L 114 168 
       L 94 144 Z"
    fill="url(#mGradCenter)"
  />

  <!-- Geodetic Coordinate Node (Titik Spatial Terpusat) -->
  <circle cx="128" cy="52" r="14" fill="#38bdf8" />
  <circle cx="128" cy="52" r="7" fill="#ffffff" />
  <circle cx="128" cy="52" r="22" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
</svg>

