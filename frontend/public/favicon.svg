<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><title>Logo GeoMinsel Minahasa Selatan</title><g transform="translate(-12.43 -12.43) scale(8.777)">
  
  <!-- Background Shield (Perisai Pin Minsel) -->
  <path
    d="M 16 2 
       C 19 2, 23 4, 25 3 
       C 27 2, 28 5, 28 8 
       C 29 15, 28 20, 22 25 
       L 16 30 
       L 10 25 
       C 4 20, 3 15, 4 8 
       C 4 5, 5 2, 7 3 
       C 9 4, 13 2, 16 2 Z"
    fill="#0f172a"
    stroke="#f59e0b"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Ear Tufts / Mahkota Manguni -->
  <polygon points="7,3 5,6 9,5" fill="#fde047" />
  <polygon points="25,3 27,6 23,5" fill="#fde047" />

  <!-- Carmine Red Crest -->
  <path
    d="M 8 7 
       C 12 9, 16 8, 16 9 
       C 16 8, 20 9, 24 7 
       C 24 13, 21 16, 16 16 
       C 11 16, 8 13, 8 7 Z"
    fill="#ef4444"
  />

  <!-- High-Contrast Manguni Vigilant Eyes -->
  <circle cx="11.5" cy="14" r="3.2" fill="#fde047" />
  <circle cx="11.5" cy="14" r="1.6" fill="#0b132b" />
  <circle cx="12" cy="13.5" r="0.6" fill="#ffffff" />

  <circle cx="20.5" cy="14" r="3.2" fill="#fde047" />
  <circle cx="20.5" cy="14" r="1.6" fill="#0b132b" />
  <circle cx="21" cy="13.5" r="0.6" fill="#ffffff" />

  <!-- Beak -->
  <polygon points="16,14 14.5,18 16,21 17.5,18" fill="#f59e0b" />

  <!-- Coordinate Beacon Dot -->
  <circle cx="16" cy="26" r="1.5" fill="#38bdf8" />
</g></svg>